spring.application.name=footballion
server.port=${PORT:8080}

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/footballdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate ddl-auto (update tables based on entity classes)
spring.jpa.hibernate.ddl-auto=update

# Enable H2 Console (so we can see the DB in the browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console